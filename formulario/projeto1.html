 <h1>Matrícula - Escola Online</h1>

<fieldset>
<legend>Dados pessoais</legend>
<form action="/cadastro" method="post"></form>
  <label for="nome">Nome completo:</label>
  <input type="text" id="nome" name="nome">
<br>
<br>
<label for="nascimento">Data de nascimento:</label>
<input type="date" id="nascimento" name="nascimento">
<br>
<br>
<label for="email">E-mail do Aluno:</label>
<input type="text" name="email" placeholder="aluno@exemplo.com">
<br>
<br>
<label for="senha">Senha de Acesso:</label>
<input type="password" id="senha" name="senha" placeholder="**********">
<br>
<br>
<label for="telefone">Telefone de Emergência:</label>
<input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
 </fieldset>
 </form>
<fieldset>
    <Legend>Preferências de Estado</Legend>
    <p>Áreas de Interesse: </p>
<input type="checkbox" id="frontend" name="interesses" value="frontend">
<label for="frontend">Front-End</label>
<br>
<input type="checkbox" id="backend" name="interesses" value="backend">
<label for="backend">Back-End</label>
<br>
<input type="checkbox" id="design" name="interesses" value="design">
<label for="design">Design</label>
<br>
<input type="checkbox" id="dados" name="interesses" value="dados">
<label for="dados">Dados</label>
<br>
<br>
<label for="conhecer">Como conheceu a escola?:</label>
<select id="conhecer" name="conhecer">
  <option value="">Indicação</option>
</select>
    </fieldset>
    <br>
<button type="submit">Matricular</button>
<button type="reset">Limpar</button>
